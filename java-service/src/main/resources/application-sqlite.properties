# ===== profile: sqlite（默认）=====
# SQLite 是单写者：连接池收到 1，让写操作天然串行，用"确定性"换"并发"
spring.datasource.url=jdbc:sqlite:${app.db.path:data/mock-oa.db}?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

app.db.path=${APP_DB_PATH:data/mock-oa.db}

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=mock-oa-sqlite
spring.datasource.hikari.connection-timeout=10000

# 选 schema-sqlite.sql（见共用配置里的 schema-locations）
spring.sql.init.platform=sqlite

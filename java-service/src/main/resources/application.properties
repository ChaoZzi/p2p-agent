# ===== P0-02 §0 共用配置（两个 profile 共享；profile 专属配置在 application-<profile>.properties）=====
server.port=8000
spring.application.name=mock-oa

# 不传任何参数时走 sqlite：零依赖、clone 下来就能跑（面试演示友好）
spring.profiles.default=sqlite

# schema 初始化：schema 文件名由 spring.sql.init.platform 决定，platform 在各自的 profile 里声明
# 显式写 schema-locations（而不是依赖 Boot 的 schema-${platform}.sql 默认约定）：
# 文件名写错时要"启动即失败"，而不是静默跳过初始化让服务带着空库跑起来
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-${spring.sql.init.platform}.sql

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId:-none}] %logger{32} - %msg%n
logging.level.root=INFO
logging.level.org.springdoc=WARN

# ===== P0-01 mock-oa =====
server.port=8000
spring.application.name=mock-oa

# --- SQLite 幂等表（P0-01 先落库：既满足"幂等落地"，也为 P0-02 的 sqlite-jdbc 去风险）---
# 路径默认相对 java-service/（spring-boot:run 的 workingDirectory 已钉死）；可用 APP_DB_PATH 覆盖
app.db.path=${APP_DB_PATH:data/mock-oa.db}
# busy_timeout：SQLite 写锁被占用时等待而不是立刻 SQLITE_BUSY
spring.datasource.url=jdbc:sqlite:${app.db.path}?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 是单写者：把连接池收到 1，写操作天然串行，避免锁竞争（换取确定性，mock 场景够用）
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=mock-oa-sqlite
spring.datasource.hikari.connection-timeout=10000

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- 日志：每条日志带 [trace=<uuid>]（MDC 由 TraceFilter 写入）---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId:-none}] %logger{32} - %msg%n
logging.level.root=INFO
# springdoc 的 swagger-ui 请求也走 TraceFilter，噪音日志压掉
logging.level.org.springdoc=WARN

# ===== profile: postgres（PostgreSQL 16）=====
# 凭据卫生：本文件只允许出现占位符。
#   真实密码来源（二选一，都不入库）：
#     1) 本地未提交文件 application-postgres-local.properties（已被 .gitignore 覆盖）
#     2) 环境变量 PG_PASSWORD（scripts\run-java.cmd 前 set PG_PASSWORD=...）
# 若两者都没有，会以 "Could not resolve placeholder 'PG_PASSWORD'" 快速失败 —— 这是刻意的：
# 宁可在启动时立刻报错，也不要带着空密码去撞数据库。
spring.config.import=optional:classpath:application-postgres-local.properties

spring.datasource.url=${PG_URL:jdbc:postgresql://127.0.0.1:5432/p2p_agent}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PG_USER:p2p_agent}
spring.datasource.password=${PG_PASSWORD}

# PG 支持真并发写：连接池开到 10（SQLite profile 是 1）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=mock-oa-postgres
spring.datasource.hikari.connection-timeout=10000

# 选 schema-postgres.sql（见共用配置里的 schema-locations）
spring.sql.init.platform=postgres

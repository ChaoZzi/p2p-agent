[project]
name = "p2p-agent-python-service"
version = "0.1.0"
description = "P2P Agent Python 侧（L0 入口 API + Agent Harness + 企业系统工具客户端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# 说明：本目录不是要发布的库，不写 [build-system]——
# uv 会把它当"虚拟工程"（只装依赖、不装自身），省掉一层打包配置。

[tool.pytest.ini_options]
# tests/ 里要 import agents.* / llm.* / trace.*（都是 python-service 下的裸包）
pythonpath = ["."]
testpaths = ["tests"]
